# CI/CD PocketFlow
#
# Push ke main (kecuali perubahan dokumen saja):
#   1. analyze + test                                   (~1 menit)
#   2. build web  -> langsung tayang di GitHub Pages    (~3-4 menit sejak push)
#   3. build APK  -> uji buka di emulator Android -> APK diperbarui di Pages
#
# Pull request ke main: analyze + test, build & uji jalan iOS di simulator.
# iOS juga bisa dijalankan manual: Actions -> CI/CD -> Run workflow.
#
# Link:
#   Web : https://zee7x.github.io/Pocket-Flow/
#   APK : https://zee7x.github.io/Pocket-Flow/download/
#
# gh-pages selalu ditimpa dengan SATU commit (riwayat build lama tidak
# disimpan), jadi ukuran repo tidak terus membesar.
#
# Butuh Repository variables SUPABASE_URL dan SUPABASE_ANON_KEY
# (Settings -> Secrets and variables -> Actions -> Variables).

name: CI/CD

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE", ".kiro/**"]
  pull_request:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE", ".kiro/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.38.5"

jobs:
  test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # ─── Web: build lalu langsung tayang ─────────────────────────────────────
  web:
    name: Build & deploy web
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Konfigurasi Supabase
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Repository variables SUPABASE_URL dan SUPABASE_ANON_KEY belum diisi."
            exit 1
          fi
          printf '{"SUPABASE_URL":"%s","SUPABASE_ANON_KEY":"%s"}' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > "$RUNNER_TEMP/env.json"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build web
        run: >
          flutter build web --release
          --base-href /Pocket-Flow/
          --dart-define-from-file=$RUNNER_TEMP/env.json
      - name: Deploy web (APK yang sudah ada tetap dipertahankan)
        uses: ./.github/actions/publish-pages
        with:
          part: web
          source: build/web

  # ─── Android: build APK, uji buka di emulator, lalu publikasikan ─────────
  android:
    name: Build APK & uji di emulator
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Konfigurasi Supabase
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: printf '{"SUPABASE_URL":"%s","SUPABASE_ANON_KEY":"%s"}' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > "$RUNNER_TEMP/env.json"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build APK
        # Maven Central kadang membalas 429 ke runner GitHub: ulangi sampai 3x.
        run: |
          for i in 1 2 3; do
            flutter build apk --release --split-per-abi \
              --target-platform android-arm,android-arm64,android-x64 \
              --build-number ${{ github.run_number }} \
              --dart-define-from-file=$RUNNER_TEMP/env.json && exit 0
            echo "Build APK gagal (percobaan $i), coba lagi dalam 60 detik..."
            sleep 60
          done
          exit 1
      - name: Aktifkan KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Uji buka di emulator Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r build/app/outputs/flutter-apk/app-x86_64-release.apk
            adb logcat -c
            adb shell monkey -p com.example.pocket_flow -c android.intent.category.LAUNCHER 1
            sleep 30
            adb exec-out screencap -p > android-launch.png
            adb logcat -d > android-logcat.txt
            if grep -q "FATAL EXCEPTION" android-logcat.txt; then echo "::error::Aplikasi crash di Android"; grep -A20 "FATAL EXCEPTION" android-logcat.txt; exit 1; fi
            adb shell pidof com.example.pocket_flow || (echo "::error::Proses aplikasi tidak berjalan"; exit 1)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke
          path: |
            android-launch.png
            android-logcat.txt
          retention-days: 3
      - name: Susun folder unduhan
        run: |
          mkdir -p dl
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dl/pocketflow-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dl/pocketflow-armv7.apk
          cat > dl/index.html <<EOF
          <!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Unduh PocketFlow</title>
          <body style="font-family:system-ui;max-width:480px;margin:40px auto;padding:0 16px;line-height:1.5">
          <h2>PocketFlow untuk Android</h2>
          <p>Build #${{ github.run_number }} dari commit <code>${GITHUB_SHA::7}</code>.</p>
          <p><a href="pocketflow-arm64.apk"><b>Unduh APK</b></a> (hampir semua HP Android 2018 ke atas)</p>
          <p><a href="pocketflow-armv7.apk">APK untuk HP lama (armv7)</a></p>
          <p><a href="../">Buka versi web</a></p>
          </body>
          EOF
      - name: Publikasikan APK (web yang sudah tayang tetap dipertahankan)
        uses: ./.github/actions/publish-pages
        with:
          part: download
          source: dl

  # ─── iOS: hanya di pull request & manual ─────────────────────────────────
  ios:
    name: Build & uji jalan iOS
    needs: test
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    # Runner Intel supaya Google ML Kit bisa jalan di simulator.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      # connectivity_plus memakai API iOS 26, jadi butuh Xcode 26 ke atas.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Konfigurasi Supabase
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: printf '{"SUPABASE_URL":"%s","SUPABASE_ANON_KEY":"%s"}' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > "$RUNNER_TEMP/env.json"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build iOS release (tanpa signing)
        run: flutter build ios --release --no-codesign --dart-define-from-file=$RUNNER_TEMP/env.json
      - name: Build untuk simulator
        run: flutter build ios --simulator --debug --dart-define-from-file=$RUNNER_TEMP/env.json
      - name: Buka di simulator iPhone
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build/ios/iphonesimulator/Runner.app
          xcrun simctl launch "$DEVICE" com.example.pocketFlow
          sleep 40
          xcrun simctl io "$DEVICE" screenshot ios-launch.png
          if ! xcrun simctl spawn "$DEVICE" launchctl list | grep -q "com.example.pocketFlow"; then
            echo "::error::Aplikasi tidak berjalan di simulator iOS"
            xcrun simctl spawn "$DEVICE" log show --last 2m --predicate 'process == "Runner"' | tail -50
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-smoke
          path: ios-launch.png
          retention-days: 3
